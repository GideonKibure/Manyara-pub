<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Manyara Pub inventory, sales, approvals, and income tracking."
    />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Manyara Pub</title>
    <style>
      .boot-splash{position:relative;display:grid;min-height:100vh;min-height:100dvh;place-items:center;overflow:hidden;padding:1rem;color:#fafaf9;background:radial-gradient(640px 360px at 50% 18%,rgba(251,191,36,.22),transparent 58%),linear-gradient(165deg,#1c1917 0%,#0c0a09 68%);font-family:Outfit,ui-sans-serif,system-ui,sans-serif}
      .boot-splash-card{position:relative;z-index:1;width:min(100%,26rem);padding:1.4rem 1.1rem 1.25rem;text-align:center;background:rgba(18,14,12,.88);border:1px solid rgba(253,230,138,.28);border-radius:1.75rem}
      .boot-kicker{margin:.85rem 0 0;font-size:.7rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#fbbf24}
      .boot-title{margin:.45rem 0 0;font-family:Fraunces,ui-serif,Georgia,serif;font-size:1.6rem}
      .boot-hint{margin:.55rem 0 0;font-size:.9rem;color:#d6d3d1}
      .boot-pints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem;margin-top:1rem}
      .boot-glass{display:block;margin:0 auto;width:1.05rem;height:2.4rem;border-radius:999px 999px 8px 8px;background:linear-gradient(180deg,#fde68a,#b45309 58%,#78350f);animation:boot-pour 1.15s ease-in-out infinite;transform-origin:50% 100%}
      .boot-glass-delay{animation-delay:.18s;height:2.9rem}
      .boot-glass-late{animation-delay:.36s}
      .boot-track{margin:1.2rem auto 0;height:4px;width:100%;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.12)}
      .boot-bar{display:block;height:100%;width:38%;border-radius:inherit;background:linear-gradient(90deg,#f59e0b,#fde68a,#f59e0b);animation:boot-slide 1.2s ease-in-out infinite}
      @keyframes boot-pour{0%,100%{transform:scaleY(.72);opacity:.7}50%{transform:scaleY(1);opacity:1}}
      @keyframes boot-slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-live="polite">
        <div class="boot-splash-card">
          <img src="/logo.png" alt="Manyara Pub" width="136" height="136" style="display:block;margin:0 auto;height:8.5rem;width:auto;max-width:12rem;object-fit:contain" />
          <p class="boot-kicker">Manyara Pub</p>
          <p class="boot-title">Opening Manyara Pub</p>
          <p class="boot-hint">Your stock, sales, and bills are coming in.</p>
          <div class="boot-pints" aria-hidden="true">
            <span class="boot-glass"></span>
            <span class="boot-glass boot-glass-delay"></span>
            <span class="boot-glass boot-glass-late"></span>
          </div>
          <div class="boot-track"><span class="boot-bar"></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
